name: release gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The minifier configuration is part of the release record, so the version
      # is pinned rather than floating.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: npm install --no-package-lock --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium firefox webkit

      # Unit tests, minification, unit tests against the minified artifact, the
      # byte budget, and a real Chromium loading the library through
      # /content/<id> exactly as an inscription does.
      - run: node scripts/gate.mjs
